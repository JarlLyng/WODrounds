name: Docs integrity

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/validate_docs.py'
      - '.github/workflows/docs.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate docs
        run: python3 scripts/validate_docs.py
